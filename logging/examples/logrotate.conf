# Logrotate configuration for Perssua
# Installation: sudo cp config/logrotate.d/perssua /etc/logrotate.d/perssua
# Verify: sudo logrotate -d /etc/logrotate.d/perssua
# Manual rotation: sudo logrotate -f /etc/logrotate.d/perssua

/path/to/perssua-app/data/logs/perssua.log {
    # Rotation trigger
    size 10M                    # Rotate when file reaches 10 MB
    rotate 5                    # Keep 5 rotated files

    # Compression
    compress                    # Compress old logs with gzip
    delaycompress              # Delay compression until next rotation

    # File handling
    copytruncate               # Truncate original file after copy (safe for running processes)
    missingok                  # Don't error if file is missing
    notifempty                 # Don't rotate empty files

    # Timestamps
    dateext                    # Add date to rotated files (e.g., perssua.log-20260706)
    dateformat -%Y%m%d         # Date format: YYYYMMDD

    # Permissions
    create 0640 %u %g          # Create new file with these permissions

    # Cleanup
    maxage 30                  # Delete logs older than 30 days

    # Execution
    postrotate
        # Optional: Reload/signal application (if running as service)
        if command -v systemctl &> /dev/null && systemctl is-active --quiet perssua; then
            systemctl reload perssua 2>/dev/null || true
        fi
    endscript
}
